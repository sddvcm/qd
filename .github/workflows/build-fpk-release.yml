name: Build and Release QDX FPK

# 打 tag 时自动构建 FPK 安装包与源码包，发布到 GitHub Releases。
# 程序内自动更新（updater.py）从本 Release 拉取源码包，因此这个流程
# 是「更新不需要重装 FPK」这条链路的上游。

on:
  push:
    tags:
      - "v*"
      - "[0-9]*"
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（留空则读取 version.json）"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-fpk:
    runs-on: ubuntu-latest
    name: Build FPK Package
    if: startsWith(github.repository, 'sddvcm/qd')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Determine version
        id: ver
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            RAW="${{ github.event.inputs.version }}"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            RAW="${GITHUB_REF#refs/tags/}"
          else
            RAW=""
          fi
          RAW="${RAW#v}"
          echo "raw=${RAW}" >> "$GITHUB_OUTPUT"
          if [ -n "${RAW}" ]; then
            echo "tag=v${RAW}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch template snapshot
        run: |
          # 内置模板快照来自上游模板库，仅作为数据打包，与运行时代码无关
          git clone --depth 1 https://github.com/qd-today/templates.git templates-snapshot

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip

      - name: Build FPK
        run: |
          VERSION="${{ steps.ver.outputs.raw }}"
          if [ -n "${VERSION}" ]; then
            python build_fpk.py --version "${VERSION}"
          else
            python build_fpk.py
          fi

      - name: Collect artifacts
        id: collect
        run: |
          FPK_PATH="deploy/fnos/qdx/qdx.fpk"
          if [ ! -f "${FPK_PATH}" ]; then
            echo "::error::FPK 构建产物未找到"
            exit 1
          fi
          FNOS_VER=$(grep -E '^version' deploy/fnos/qdx/manifest | head -1 | awk -F'=' '{print $2}' | xargs)
          mkdir -p dist
          cp "${FPK_PATH}" "dist/qdx-${FNOS_VER}.fpk"
          cp "${FPK_PATH}" dist/qdx.fpk

          # 源码包供程序内自动更新使用，只含代码不含 wheel/templates
          tar --exclude='.git' \
              --exclude='deploy/fnos/qdx' \
              --exclude='wheels-tmp' \
              --exclude='templates-snapshot' \
              --exclude='node_modules' \
              --exclude='__pycache__' \
              --exclude='*.pyc' \
              --exclude='tools' \
              -czf "dist/qdx-source-${FNOS_VER}.tar.gz" \
              --transform "s,^\.,qdx-${FNOS_VER}," .

          echo "fnos_version=${FNOS_VER}" >> "$GITHUB_OUTPUT"
          ls -la dist/
          echo ""
          echo "=== SHA256 ==="
          sha256sum dist/* || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qdx-fpk
          path: dist/*

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          name: QDX ${{ steps.collect.outputs.fnos_version }}
          generate_release_notes: true
          body: |
            ## QDX ${{ steps.collect.outputs.fnos_version }}

            飞牛 fnOS 安装包与程序内更新所需的源码包。

            ### 安装
            下载 `qdx-${{ steps.collect.outputs.fnos_version }}.fpk`，在飞牛「应用中心 → 手动安装」上传即可。
            安装过程完全离线，内置全部依赖与 388 个公共模板。

            ### 更新
            已安装的用户无需重新下载 FPK。打开 QDX 后在「关于」页面点击检查更新，
            程序会自动拉取本 Release 的源码包完成原地升级，数据库与配置自动保留。

            ### 文件说明
            - `qdx-*.fpk` — 飞牛应用安装包（首次安装用）
            - `qdx.fpk` — 同上，固定文件名便于直接引用
            - `qdx-source-*.tar.gz` — 源码更新包（程序内更新用，不要手动解压覆盖）
